<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:0;background:#eef3f8;font-family:'Poppins','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px;background:#eef3f8;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border:1px solid #d9e2ec;border-radius:20px;overflow:hidden;box-shadow:0 18px 48px rgba(15,23,42,0.08);">
            <tr>
              <td style="padding:28px 32px;background:linear-gradient(180deg,#7f1d1d 0%,#dc2626 100%);color:#ffffff;">
                <img src="{{ logo_url }}" alt="{{ app_name }} logo" width="42" height="42" style="display:block;border-radius:10px;margin-bottom:14px;" />
                <div style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.82;margin-bottom:10px;">Alerta relevante</div>
                <h1 style="margin:0;font-size:28px;line-height:1.2;font-weight:700;">{{ title }}</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px;font-size:16px;line-height:1.7;">Hola {{ user_name }},</p>
                <div style="padding:18px 20px;border:1px solid #fecaca;border-radius:16px;background:#fff7f7;">
                  <p style="margin:0;font-size:15px;line-height:1.85;color:#334155;">{{ message }}</p>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 32px;border-top:1px solid #e2e8f0;background:#f8fafc;">
                <p style="margin:0 0 8px;font-size:12px;line-height:1.7;color:#64748b;">
                  Este es un correo informativo enviado por {{ app_name }}. Si la situación requiere acción inmediata, sigue las indicaciones de tu equipo de salud.
                </p>
                <p style="margin:0;font-size:12px;line-height:1.7;color:#94a3b8;">
                  {{ app_name }} | Alertas de salud | {{ year }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

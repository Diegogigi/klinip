<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;">
            <tr>
              <td style="padding:18px 22px;background:linear-gradient(135deg,#2563eb,#22c55e);color:#ffffff;">
                <img src="{{ logo_url }}" alt="{{ app_name }} logo" width="36" height="36" style="display:block;margin-bottom:10px;border-radius:8px;">
                <h2 style="margin:0;font-size:22px;">Orden médica procesada</h2>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 22px;">
                <p style="margin:0 0 12px;">Hola {{ user_name }},</p>
                <p style="margin:0 0 12px;">Tu {{ document_type }} fue cargada correctamente.</p>
                <p style="margin:0;">Fecha de carga: <strong>{{ uploaded_at }}</strong>.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 22px;color:#64748b;font-size:12px;border-top:1px solid #e2e8f0;">
                {{ app_name }} · Tu salud organizada en un solo lugar · {{ year }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

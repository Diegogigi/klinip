<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Klinip | Tu salud, organizada</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eaf2ff" />
    <meta
      name="description"
      content="Centraliza tu informaci&oacute;n cl&iacute;nica en un solo lugar para entender, gestionar y compartir tu salud de forma simple y segura."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Klinip" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260523a" />
    <!-- Splash screens iOS -->
    <link rel="apple-touch-startup-image" href="/icons/new_logo_k_sf.png?v=20260523a" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=20260523a" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=20260523a" />
    <link rel="shortcut icon" href="/icons/favicon-32x32.png?v=20260523a" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=20260523a" />
    <!-- Tipografía oficial Klinip: Nunito (rounded). Carga temprana y con preconnect
         para evitar el parpadeo a la fuente del sistema (Segoe UI). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
    />
  </head>
  <style>
    :root {
      color-scheme: light;
      --boot-bg: linear-gradient(180deg, #ffffff 0%, #f4f8ff 58%, #eaf2ff 100%);
      --boot-text: #0b0f19;
      --boot-muted: #64748b;
      --boot-track: rgba(191, 215, 255, 0.72);
      --boot-fill: linear-gradient(90deg, #4da3ff 0%, #1678f2 48%, #0d47f7 100%);
      --boot-ring: rgba(13, 71, 247, 0.16);
      --boot-ring-inner: rgba(77, 163, 255, 0.28);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5f7fa;
    }

    body.theme-dark {
      color-scheme: dark;
      --boot-bg: linear-gradient(180deg, #070d17 0%, #0b0f19 66%, #10213f 100%);
      --boot-text: #f5f7fa;
      --boot-muted: rgba(234, 242, 255, 0.8);
      --boot-track: rgba(71, 85, 105, 0.56);
      --boot-fill: linear-gradient(90deg, #8fc5ff 0%, #4da3ff 40%, #0d47f7 100%);
      --boot-ring: rgba(203, 213, 225, 0.18);
      --boot-ring-inner: rgba(77, 163, 255, 0.28);
    }

    #root {
      min-height: 100dvh;
    }

    .boot-fallback {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.4rem;
      background:
        radial-gradient(circle at top left, rgba(77, 163, 255, 0.16), transparent 30%),
        radial-gradient(circle at bottom right, rgba(13, 71, 247, 0.1), transparent 26%),
        var(--boot-bg);
      color: var(--boot-text);
      font-family: Nunito, "Avenir Next Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .boot-fallback__shell {
      width: min(100%, 25rem);
      display: grid;
      justify-items: center;
      gap: 0.95rem;
      text-align: center;
      animation: bootFadeIn 360ms ease-out both;
    }

    .boot-fallback__orbit {
      position: relative;
      width: 8.25rem;
      height: 8.25rem;
      display: grid;
      place-items: center;
    }

    .boot-fallback__orbit::before,
    .boot-fallback__orbit::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      inset: 0;
    }

    .boot-fallback__orbit::before {
      border: 1px solid var(--boot-ring);
      animation: bootSpin 5.8s linear infinite;
    }

    .boot-fallback__orbit::after {
      inset: 0.95rem;
      border: 1px dashed var(--boot-ring-inner);
      animation: bootSpinReverse 4.4s linear infinite;
    }

    .boot-fallback__logo {
      width: 3.85rem;
      height: 3.85rem;
      object-fit: contain;
      filter: drop-shadow(0 14px 20px rgba(13, 71, 247, 0.16));
      position: relative;
      z-index: 1;
    }

    .boot-fallback__kicker {
      margin: 0.15rem 0 0;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--boot-muted);
    }

    .boot-fallback__wordmark {
      margin: 0;
      font-size: clamp(3rem, 12vw, 4.2rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
      font-weight: 800;
      color: var(--boot-text);
    }

    .boot-fallback__text {
      margin: 0;
      max-width: 19rem;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--boot-muted);
    }

    .boot-fallback__progress {
      width: min(100%, 14.5rem);
      height: 0.45rem;
      border-radius: 999px;
      background: var(--boot-track);
      overflow: hidden;
    }

    .boot-fallback__progress span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: var(--boot-fill);
      box-shadow: 0 0 18px rgba(13, 71, 247, 0.18);
      animation: bootProgress 1.8s ease-in-out infinite;
    }

    .boot-fallback__footnote {
      margin: 0;
      max-width: 18rem;
      font-size: 0.84rem;
      line-height: 1.45;
      color: var(--boot-muted);
    }

    @keyframes bootFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bootSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bootSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes bootProgress {
      0% { transform: translateX(-118%); }
      55% { transform: translateX(180%); }
      100% { transform: translateX(180%); }
    }

    @media (max-width: 640px) {
      .boot-fallback {
        padding: 1rem;
      }

      .boot-fallback__shell {
        gap: 0.85rem;
      }

      .boot-fallback__orbit {
        width: 7.4rem;
        height: 7.4rem;
      }

      .boot-fallback__orbit::after {
        inset: 0.85rem;
      }

      .boot-fallback__logo {
        width: 3.45rem;
        height: 3.45rem;
      }

      .boot-fallback__text {
        max-width: 17rem;
        font-size: 0.94rem;
      }

      .boot-fallback__footnote {
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-fallback__shell,
      .boot-fallback__orbit::before,
      .boot-fallback__orbit::after,
      .boot-fallback__progress span {
        animation: none !important;
      }
    }
  </style>
  <body class="bg-slate-50">
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme");
          if (savedTheme === "dark") {
            document.body.classList.add("theme-dark");
          } else {
            document.body.classList.remove("theme-dark");
          }
        } catch (_error) {
          document.body.classList.remove("theme-dark");
        }
      })();
    </script>
    <div id="root">
      <div class="boot-fallback" role="status" aria-live="polite" aria-label="Cargando Klinip">
        <div class="boot-fallback__shell">
          <div class="boot-fallback__orbit" aria-hidden="true">
            <img class="boot-fallback__logo" src="/icons/new_logo_k.png?v=20260523a" alt="" />
          </div>
          <p class="boot-fallback__kicker">Tu salud, organizada</p>
          <p class="boot-fallback__wordmark">Klinip</p>
          <p class="boot-fallback__text">Centralizando tu información clínica para que avances con calma y claridad.</p>
          <div class="boot-fallback__progress" aria-hidden="true"><span></span></div>
          <p class="boot-fallback__footnote">Cargando tus módulos clínicos y recordatorios personalizados.</p>
        </div>
      </div>
    </div>
    <div id="overlay-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
